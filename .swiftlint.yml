# RuneWeaver SwiftLint configuration (MVP).
#
# MVP policy: silence non-critical style so the lint gate only fails on
# real problems. Auto-fixable style (trailing commas, brace spacing) and
# aspirational TODO tracking are disabled for now; length/complexity
# budgets stay at 1000 lines per file and 350 lines per type body —
# oversized stores/extractors/coordinators are split into focused helpers
# instead of raising the gate (largest type body ~300 lines, longest line
# ~156 chars, hottest function complexity ~18).
# Tests are excluded from strict style rules: they favour readability
# over production budgets.

excluded:
  - .build
  - DerivedData
  - Tests

disabled_rules:
  - trailing_comma
  - todo
  - opening_brace

line_length:
  warning: 160
  error: 200
  ignores_urls: true
  ignores_function_declarations: true
  ignores_comments: true

file_length:
  warning: 1000
  error: 1200
  ignore_comment_only_lines: true

function_body_length:
  warning: 100
  error: 150

type_body_length:
  warning: 350
  error: 450

function_parameter_count:
  warning: 6
  error: 7

cyclomatic_complexity:
  warning: 20
  error: 40

identifier_name:
  excluded:
    - fd
    - id
    - x
    - y
    - to
    - cc
    - ok
    - op
